<?php

session_start();

if (!isset($_SESSION['angka'])) {
    $_SESSION['angka'] = rand(1, 50);
}

$angka = $_SESSION['angka'];

$pesan = "";

if (isset($_POST['tebak'])) {

    $tebak = (int) $_POST['tebak'];

    if ($tebak == $angka) {

        $pesan = "🎉 Selamat! Tebakan kamu benar.";

    } elseif ($tebak < $angka) {

        $pesan = "❌ Tebakan terlalu kecil.";

    } else {

        $pesan = "❌ Tebakan terlalu besar.";

    }
}

if (isset($_POST['reset'])) {

    $_SESSION['angka'] = rand(1, 50);

    $pesan = "";

}

?>

    <h1>🎮 Game Tebak Angka</h1>

    <p>Tebak angka dari <b>1 sampai 50</b></p>

    <?php if ($pesan != ""): ?>

        <p class="pesan">
            <?php echo htmlspecialchars($pesan); ?>
        </p>

    <?php endif; ?>

    <form method="post">

        <input
            type="number"
            name="tebak"
            min="1"
            max="50"
            placeholder="Masukkan angka"
            required
        >

        <br>

        <button type="submit">
            Tebak
        </button>

    </form>

        </button>
